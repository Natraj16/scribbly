<script>
var S={sessions:[],life:[],xp:0};

function save(){try{localStorage.setItem("fq1",JSON.stringify(S))}catch(e){}}
var tab="study",cur=null,GOAL=120;
var day=function(t){return new Date(t).toDateString()};

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function dayMin(d){return S.sessions.filter(function(x){return day(x.t)===d}).reduce(function(a,x){return a+x.min},0)}
function lifeMin(d,fun){return S.life.filter(function(x){return day(x.t)===d&&(!fun||x.fun)}).reduce(function(a,x){return a+x.min},0)}
function level(){return Math.floor(Math.sqrt(S.xp/50))+1}
function streak(){var n=0,d=new Date();if(!dayMin(d.toDateString()))d.setDate(d.getDate()-1);while(dayMin(d.toDateString())>=10){n++;d.setDate(d.getDate()-1)}return n}
function elapsed(){if(!cur)return 0;var now=Date.now(),a=cur.away+(cur.hid?now-cur.hid:0);return Math.max(0,(now-cur.start-a)/1000)}
function score(){return cur?Math.max(0,100-(cur.strict?25:12)*cur.dist):100}
var BADGES=[["🌱","First session",function(){return S.sessions.length>=1}],["🔥","3-day streak",function(){return streak()>=3}],["🧘","Zero-distraction 25 min",function(){return S.sessions.some(function(x){return x.min>=25&&x.score===100})}],["⚖️","Balanced day",function(){return dayMin(today())>=30&&lifeMin(today())>=15}],["🎯","Daily goal hit",function(){return dayMin(today())>=GOAL}],["🚶","Walked 3 times",function(){return S.life.filter(function(x){return x.act==="Walk"}).length>=3}]];
document.addEventListener("visibilitychange",function(){
 if(!cur)return;
 if(document.hidden){cur.hid=Date.now()}
 else if(cur.hid){cur.away+=Date.now()-cur.hid;cur.hid=0;cur.dist++;render()}
});
setInterval(function(){if(cur&&!document.hidden&&tab==="study"){var e=document.getElementById("tm");if(e)e.textContent=fmt(elapsed())}},1000);

function plan(){
 var o=S.one.d===today()?S.one:null,c=S.checks[S.checks.length-1];if(!c||day(c.t)!==today())c={mood:0,energy:0};

 var h='<div class="card" style="position:relative"><span class="deco" style="right:16px;top:14px">'+art("star",48)+'</span><b>Guilt-free fun bank</b><div class="big" style="font-size:40px;color:'+(left>=0?'var(--ok)':'var(--bad)')+'">'+left+' min</div><p class="mu" style="margin:0">Every 3 minutes of focused study earns 1 minute of games or anime. Reading, walks and hobbies are always free and give XP.</p></div>';
 acts.forEach(function(a){h+='<div class="card" style="position:relative"><span class="deco" style="right:16px;top:14px">'+art(a[4],46)+'</span><b>'+a[1]+'</b><div class="row" style="margin-top:12px">';
  [15,30,60].forEach(function(m){h+='<button class="chip" onclick="logLife(\''+a[1]+'\','+m+','+a[2]+','+a[3]+')">+'+m+' min</button>'});h+='</div></div>'});
 var w=lifeMin(today());return h+'<p class="mu">Me-time logged today: '+w+' min</p>'}
function prog(msg){
 var lv=level(),base=50*(lv-1)*(lv-1),next=50*lv*lv,pct=(S.xp-base)/(next-base)*100;
 var h=(msg?'<div class="card" style="border-color:var(--ok)">'+esc(msg)+'</div>':'')
 +'<div class="card" style="position:relative;margin-top:44px"><span class="deco" style="right:20px;top:-50px">'+mascot(100,3,"#ffd45a",64,"cap")+'</span><div class="row" style="justify-content:space-between"><b>Level '+lv+'</b><span class="mu">'+S.xp+' XP · '+streak()+'-day streak 🔥</span></div><div class="bar" style="margin:8px 0"><i style="width:'+pct+'%"></i></div><span class="mu">'+(next-S.xp)+' XP to level '+(lv+1)+'</span></div>';
 var d=new Date(),bars='',mx=60;
 for(var i=6;i>=0;i--){var x=new Date(d);x.setDate(d.getDate()-i);var m=dayMin(x.toDateString());mx=Math.max(mx,m);bars+='<div><b style="height:'+Math.round(m/mx*70)+'px"></b>'+"SMTWTFS"[x.getDay()]+'</div>'}
 h+='<div class="card"><b>Last 7 days (study min)</b><div class="days" style="margin-top:10px">'+bars+'</div></div>';
 h+='<div class="card"><b>Badges</b><div style="margin-top:6px">'+BADGES.map(function(b,i){return '<span class="badge'+(b[2]()?'':' off')+'">'+art(["star","book","trophy","moon","pencil","shoe"][i],18)+b[1]+'</span>'}).join('')+'</div></div>';
 var rec=S.sessions.slice(-5).reverse();
 h+='<div class="card"><b>Recent sessions</b>'+(rec.length?rec.map(function(x){return '<div class="row" style="justify-content:space-between;margin-top:8px"><span>'+esc(x.topic)+'<br><span class="mu">'+x.min+' min · '+x.dist+' distractions</span></span><b style="color:'+(x.score>=70?'var(--ok)':'var(--bad)')+'">'+x.score+'</b></div>'}).join(''):'<div style="text-align:center">'+mascot(70,4,"#9fd6f7",72)+'<p class="mu">No sessions yet. Your buddies are waiting.</p></div>')+'</div>';
 return h}
function render(msg){
 var el=document.getElementById("app");
 el.innerHTML='<header><h1>Scribbly</h1><span class="pill">Lv '+level()+'</span></header>'+(tab==="study"?study():tab==="life"?life():tab==="plan"?plan():tab==="ins"?ins():prog(typeof msg==="string"?msg:""));
 document.querySelectorAll("nav button").forEach(function(b){b.className=b.dataset.t===tab?"on":""});
 var ls=S.sessions.length?S.sessions[S.sessions.length-1].score:100;
 document.getElementById("ft").innerHTML='<div class="crew">'+mascot(ls,0,"#ff6b5e",52,"cap")+mascot(ls,3,"#ffd45a",52)+mascot(ls,1,"#5ab4f0",52)+mascot(ls,4,"#fafafa",52)+mascot(ls,2,"#ff9ecb",52)+'</div><p>Study hard. Then go outside.</p><span class="lbl">Level '+level()+' · '+S.xp+' XP</span>';
}
document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){tab=b.dataset.t;render()}});
render();
</script></body></html>
